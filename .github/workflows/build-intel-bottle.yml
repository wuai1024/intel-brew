name: Build Intel Homebrew Bottle

on:
  workflow_dispatch:
    inputs:
      formulae:
        description: JSON array of Homebrew formulae to build
        required: true
        default: '["aliyun-cli","mysql@8.4","openjdk","redis","rsync","uv","wget"]'
        type: string

permissions:
  contents: write

concurrency:
  group: build-intel-bottles-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build:
    name: Build ${{ matrix.formula }} for Intel macOS 15
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(inputs.formulae) }}
    env:
      FORMULA: ${{ matrix.formula }}

    steps:
      - name: Show runner environment
        run: |
          echo "=== Architecture ==="
          uname -m

          echo "=== macOS ==="
          sw_vers

          echo "=== Homebrew ==="
          brew --version

          echo "=== Homebrew Config ==="
          brew config

      - name: Update Homebrew
        run: |
          unset HOMEBREW_NO_AUTO_UPDATE
          brew update

      - name: Prepare dependencies and runner toolchains
        run: |
          set -euo pipefail

          while IFS= read -r dependency; do
            case "$dependency" in
              go|rust)
                continue
                ;;
            esac

            if ! brew list --versions "$dependency" >/dev/null 2>&1; then
              echo "=== Building missing dependency: $dependency ==="
              brew install --build-from-source "$dependency"
            fi
          done < <(
            brew info --json=v2 --formula "$FORMULA" |
              jq -r '(.formulae[0].dependencies + .formulae[0].build_dependencies)[]' |
              sort -u
          )

          case "$FORMULA" in
            aliyun-cli)
              if ! command -v go >/dev/null 2>&1; then
                brew install --build-from-source go
              fi
              go_root="$(go env GOROOT)"
              portable_go="/private/tmp/intel-brew-toolchain"
              ditto "$go_root" "$portable_go"
              echo "$portable_go/bin" >> "$GITHUB_PATH"
              ;;
            redis|uv)
              rust_root="$(rustc --print sysroot)"
              portable_rust="/private/tmp/intel-brew-toolchain"
              ditto "$rust_root" "$portable_rust"
              echo "$portable_rust/bin" >> "$GITHUB_PATH"
              ;;
          esac

          formula_installer="$(brew --repository)/Library/Homebrew/formula_installer.rb"
          ruby -e '
            path = ARGV.fetch(0)
            source = File.read(path)
            old = "if ((pour_bottle? && !DevelopmentTools.installed?) || build_bottle?) &&\n"
            replacement = "if (pour_bottle? && !DevelopmentTools.installed?) &&\n"
            patched = source.sub(old, replacement)
            abort "Unable to patch the unbottled dependency check" if patched == source
            File.write(path, patched)
          ' "$formula_installer"

          if [[ -d /private/tmp/intel-brew-toolchain/bin ]]; then
            superenv="$(brew --repository)/Library/Homebrew/extend/ENV/super.rb"
            ruby -e '
              path = ARGV.fetch(0)
              source = File.read(path)
              old = "    path = PATH.new(Superenv.bin)\n"
              replacement = <<~RUBY
                    path = PATH.new(Superenv.bin)
                    path.append("/private/tmp/intel-brew-toolchain/bin")
              RUBY
              patched = source.sub(old, replacement)
              abort "Unable to add the runner toolchain to Superenv" if patched == source
              File.write(path, patched)
            ' "$superenv"
          fi

      - name: Build ${{ matrix.formula }} from source
        run: |
          set -euo pipefail

          if brew list --formula "$FORMULA" >/dev/null 2>&1; then
            brew uninstall --force --ignore-dependencies --formula "$FORMULA"
          fi

          formula_file="$(
            HOMEBREW_NO_INSTALL_FROM_API=1 brew ruby -e \
              'puts Formulary.factory(ARGV.fetch(0)).path' \
              "$FORMULA"
          )"

          ruby -e '
            path = ARGV.fetch(0)
            source = File.read(path)
            if File.directory?("/private/tmp/intel-brew-toolchain/bin")
              source = source.gsub(/^  depends_on "(?:go|rust)" => :build\n/, "")
            end
            File.write(path, source)
          ' "$formula_file"

          HOMEBREW_DEVELOPER=1 HOMEBREW_NO_INSTALL_FROM_API=1 brew install \
            --build-bottle \
            "$FORMULA"

          if [[ "$FORMULA" == "redis" ]]; then
            chmod +x "$(brew --prefix "$FORMULA")"/lib/redis/modules/*.so
          fi

          brew test "$FORMULA"

      - name: Create bottle
        run: |
          set -euo pipefail

          mkdir -p dist
          cd dist

          brew bottle --json "$FORMULA"

          echo "=== Generated files ==="
          ls -lah

      - name: Validate generated files
        run: |
          set -euo pipefail
          shopt -s nullglob

          bottles=("$GITHUB_WORKSPACE"/dist/*.bottle*.tar.gz)
          metadata=(dist/*.json)

          if [[ ${#bottles[@]} -eq 0 ]]; then
            echo "No bottle files were generated" >&2
            exit 1
          fi

          if [[ ${#metadata[@]} -eq 0 ]]; then
            echo "No bottle JSON files were generated" >&2
            exit 1
          fi

          FORMULA_VERSION="$(brew list --versions "$FORMULA" | awk '{print $2}')"
          if [[ -z "$FORMULA_VERSION" ]]; then
            echo "Unable to determine the installed formula version" >&2
            exit 1
          fi

          echo "FORMULA_VERSION=$FORMULA_VERSION" >> "$GITHUB_ENV"

          echo "=== SHA256 ==="
          (
            cd dist
            shasum -a 256 ./*.bottle*.tar.gz > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
          )

          echo "=== JSON ==="
          for json_file in "${metadata[@]}"; do
            ruby -rjson -e 'JSON.parse(File.read(ARGV.fetch(0)))' "$json_file"
            cat "$json_file"
          done

      - name: Reinstall and test generated bottle
        env:
          HOMEBREW_DEVELOPER: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob

          bottles=("$GITHUB_WORKSPACE"/dist/*.bottle*.tar.gz)
          if [[ ${#bottles[@]} -eq 0 ]]; then
            echo "No bottle files were generated" >&2
            exit 1
          fi

          brew uninstall --force --ignore-dependencies --formula "$FORMULA"
          brew install "${bottles[@]}"
          brew test "$FORMULA"
          brew list --versions "$FORMULA"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${FORMULA}-${FORMULA_VERSION}-x86_64-sequoia-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          NOTES="Formula: ${FORMULA}
          Version: ${FORMULA_VERSION}
          Platform: Intel x86_64 macOS 15 Sequoia
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh release create "$TAG" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${FORMULA} ${FORMULA_VERSION} - Intel macOS 15 bottle" \
            --notes "$NOTES" \
            --latest=false
